【现象（实测）】
对最简只读端点 `GET /api/auth/check` 连打 20 次：
- 11 次正常返回
- 2 次慢（3–12 秒）
- **7 次完全超时（>12 秒）**
且呈**"连续 3 次一起挂"的成组特征**；同期还出现 502，`/API/admin/channels` 偶发只回 14,685 字节（正常 305,055 字节）。
→ **该服务端自身约 35% 的请求会挂起。**

【为什么这条致命】
用 SSRF 做内网探测时，判断依据通常是"超时 ⇒ 目标不可达"。
但**一个自己会挂起的服务端，会把自己的挂起伪装成"目标超时"** → 整个"内网全部超时 ⇒ 内网不可达"的推理**根基不稳**。
本例前轮就是这样得出"内网段 10.0.0.1 / 192.168.1.1 / 172.16.0.1 / 172.20.0.1 全部超时"的，该结论在新证据下不可采信。

【对策：每批探针内置双向对照组，两者同批命中才认读数】
- **对照组 A（期望"连接被拒"）**：`http://127.0.0.1:1/` → 应返回 ECONNREFUSED
  - 作用：证明"服务端确实发出了请求，且能区分拒绝与超时"
- **对照组 B（期望"拿到内容"）**：`http://127.0.0.1:13030/login.html` → 应返回 HTML
  - 作用：证明"服务端到本机回环的链路正常、能取回响应体"
- **判读规则**：
  - A、B 同批均命中 → 本批**其余读数可信**
  - A 命中而 B 失败 → 只能采信"连接被拒"类结论，**超时类结论作废**
  - A、B 均失败 → **整批作废**，判为服务端卡顿，等待后用重测

【推论与纪律】
1. **对"内置定时任务/频繁出站/负载高"的目标做 SSRF 探测时，必须先做稳定性基线**（同一只读端点连打 15–20 次，统计超时率），超时率 >10% 就要上对照组。
2. **不要把"超时"直接写成"不可达"**：报告里要么给出对照组同批命中的证据，要么把该结论标注为"未采信/待复测"。
3. **区分三种结果再下结论**：`ECONNREFUSED`（主机活着、端口关）／`超时`（网络或主机不可达，**但可能是服务端自己挂了**）／`有响应`（真可达）。
4. 读数不稳定时**宁可少报**：把不确定的地址列进"待复测"，不要凑成一个"内网不可达"的整体结论。

【本例最终可信读数（有对照组护航）】
可达 9 个（全在 Docker 宿主网关 `172.17.0.1`：80/443/22/3306/9527/13333/13030/5566/47891）；`ECONNREFUSED` 2 个（`6379`、`2375` Docker API）；超时 0 个。
**同时必须做的对照**：这 9 个里有 8 个（80/443/22/3306/9527/13333/13030/5566）**在目标的公网 IP 上本来就开着** → **SSRF 并未扩大攻击面**，唯一 SSRF-only 增量是 `172.17.0.1:47891`。
→ **规则：SSRF 探到的内部端口必须与外网端口清单做交叉对照，否则会把"公网本来就可见的服务"误报成"内网突破"。**