【定义与边界】
- **爆破**：口令靠字典/规则猜测，逐条尝试，规模可达数百上千次 → 高噪声、易触发封禁、运营方必发现。
- **凭据复用验证**：口令来源是**配置泄露、明文回显、源码硬编码、日志泄露**等实证渠道（不是猜的），对**同集群**其它入口逐个人工试 1~2 次。
  → 这是"验证同一口令在别处是否生效"，频次极低（个位数），**不属于爆破**，可以放心做。
本条目就是把这条边界固定下来，避免"拿到真口令却因为怕爆破而不敢验证"，也避免"有了口令就顺手扩成字典"。

【本次真实场景】
口令来源：面板设置接口未认证返回明文 —— admin_password = zw4609591（203.0.113.105:13030）
按复用顺序逐个验证（每目标 ≤2 用户名 × 1 口令）：
1. 面板自身（203.0.113.105:13030 / 13050 / 13070 的登录页）→ 需浏览器实测登录，确认权限级别
2. Redis 203.0.113.97:6379：AUTH zw4609591 → **-WRONGPASS invalid username-password pair or user is disabled**（**不复用，已确认**）
3. 1Panel 203.0.113.97:9527（**重点，价值最高**）：此前用字典盲猜 2500+ 次全败、判定强口令；
   现在用真实口令试用户名 1panel 与 zwluoqi。
   注意 1Panel 的 password 字段需 **RSA_PKCS1v15 + AES-256-CBC 三段式**加密：
   `<base64(RSA(32位hex密钥))>:<base64(iv)>:<base64(AES-256-CBC(口令))>`
   （实现参考 runs/panel/brute2.py；RSA 公钥从 Set-Cookie: panel_public_key 取，base64 解码）
   该面板 CVE-2025-66507 成立（ignoreCaptcha=true 可绕验证码）——但**那只是省略验证码，仍需正确口令**。
4. MySQL 3306 / SSH 22（203.0.113.97）：3306 实测 RST 不可达；22 只允许 publickey（**无口令面，别耗时间**）
5. 同运营方其它登录面（example.com、target76.example.com、target77.example.com 等）：各试 1 次
6. 后台 API key：本例同时泄露 sk-openrouter-zw-4609591（valid_api_keys），可直接尝试调用（注意只读端点，勿产生消费）

【纪律（写进每个复用任务）】
- 每目标 ≤2 个用户名 × 1 次口令；**不引入任何字典**；命中后立即停止。
- 命中后只做**只读**权限确认（列出自己有哪些权限、能读什么），**不改配置、不建用户、不改密码**。
- 结果如实记录三类：成功 / 失败(WRONGPASS|401) / 无此入口。
- 每次尝试都要落 http_evidence 或等价原始请求（报告要能复现）。

【命中后的价值分级（决定优先打谁）】
- 运维面板（1Panel/宝塔等）复用成功 = **服务器主机权限**（可读容器、数据库、配置文件里的全部上游凭据）→ 最高优先
- 面板自身登录成功 = **账号权限**（管理员）→ 需浏览器实测 + 截图才算
- Redis/MySQL 复用成功 = 数据库权限 / 数据成果
- 后台 API key 复用成功 = 可调用其上游模型（注意别产生消费）