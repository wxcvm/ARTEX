【真实事件（靶标 example.com / 203.0.113.105:13030「LLM 管理中心」）】
- 9/28 首次抓 /API/admin/settings（未授权 GET）返回 73 字节：
  {"settings":{"log_retention_days":3},"defaults":{"log_retention_days":3}}
- 我们把这一行写进两处并固化：报告复现命令后注释 `# {"log_retention_days":3}`、runs/exploit-r2/ws-panel13030/DATA-INVENTORY.md 标注「系统配置」。
- 9/29 同一接口返回 520 字节，多出两个明文凭据：
  {"settings":{"log_retention_days":3,"api_key":"sk-openrouter-zw-4609591","admin_password":"zw4609591"},
   "defaults":{"log_retention_days":3,"api_key":"","admin_password":""},
   "valid_api_keys":["sk-openrouter-zw-4609591"],"has_custom_admin_password":true}
- 期间我们跑了 19 轮执行智能体，没有一轮重读过这个接口。旁证：设置页前端 settings.js 从 766 B 涨到 4717 B，同样没被发现。
- 发现路径很讽刺：操作者（人类）打开后台界面点了一下「设置」，密码就显示在输入框里。

【根因（两条，都不是技术原因）】
1. 认知固化：接口一旦"读过了"，结论被写进报告/清单/库，后来者读到的都是旧结论，标记为"已知、无关紧要"，没人再拉第二遍。
2. 调度偏好：所有轮次都在"打新面"（新域名/新 IP/新工具/新渠道），没有任何一轮负责"回头复核旧面有没有变"。名义上的"增量监控"轮次把范围框死在渠道，没有把"接口响应本身"纳入监控。

【可复用流程（强制）】
1. 建"未授权可读接口清单"，每条记录：URL、首次抓取时间、响应字节数、响应 SHA256、完整响应、字段集合。
2. 每次作业收口、以及任何重测动作前，对清单内**每个**接口重拉一次并算 diff：
   - 响应字节数是否变化
   - 字段集合是否变化（新增/删除的 key）——**字段新增 = 高优先级信号，立即逐字段审读**
   - 前端资源 Content-Length 是否变化（JS/CSS 变大 = 功能在长）
3. 阶段收口时，抽人**用浏览器完整过一遍界面**（新按钮/新输入框/新提示文案比接口字段更容易一眼看见）。
4. 对"设置/配置"类接口（/settings、/config、/option、/system）给最高重读优先级：它们直接映射数据库 settings 表，运营方每次在后台改配置都会新增字段。
5. 任何"已知结论"入库时，必须带**抓取时间戳**，并在下次作业时把"过期即重测"写进任务描述。

【检查清单（可直接抄进子任务）】
□ 本次是否重读了全部未授权接口？□ 是否有接口的字节数/字段数变了？□ 变了的字段是否逐条审读？
□ 前端 JS/CSS 体积是否比对过？□ 是否有人真的打开界面看过？□ 旧结论是否都带抓取时间？