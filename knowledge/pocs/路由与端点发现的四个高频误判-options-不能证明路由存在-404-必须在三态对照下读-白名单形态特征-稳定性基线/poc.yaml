【坑一：OPTIONS 不能用于路由发现】高优先级，最容易误判
实测（`203.0.113.105:11600`）：
- 14 条候选路径带会话发 `OPTIONS` → **全部 204**
- **对照组**：一个**根本不存在**的路径 `/api/nonexistent-ctrl-xyz` → **同样 204**
→ 说明 **CORS 中间件统一接管了 preflight，任何路径都回 204**。
**规则：不得据"OPTIONS 返回 204/200"推断某条路由存在。** 路由发现必须用真实方法（GET/POST）加**三态对照**。

【坑二：404 vs 401 的读法（本次靠它把结论从"观察"升级为"定论"）】
带会话探测的三种组合，含义完全不同：
| 不带会话 | 带会话 | 含义 |
| --- | --- | --- |
| 401 | **404** | **中间件已放行，router 里确实没有这条路由** ← 这才叫"路由不存在" |
| 401 | **200** | **路由存在且鉴权有效** ← 这就是要找的目标 |
| **200** | 200 | 未授权可读 ← 立刻记漏洞 |
| 404 | 404 | 路径根本不在应用里（可能连中间件都没挂） |
**关键点**：带会话拿到 404，**不是"没进屋"，而是"进了屋、屋里没这个房间"**。反之若不带会话也是 404，说明压根没进应用。
本例即靠这条判读证实："11600 上全局仅 `/api/auth/me` 一个可用端点，84 条候选带会话全 404"——**门后确实没有业务数据面**（不是我们没找到）。

【坑三：白名单硬编码的形态特征（可作为佐证）】
同一应用里，**中间件拦截的响应**与**白名单端点的响应**通常形态不同：
- 中间件拦截：`401` + 固定字节数（本例 45B `Unauthorized. Please login first.`）
- 白名单端点自己的未认证响应：**不同形态**（本例 `29B {"error":"Not authenticated"}`）
→ 出现两种不同形态，说明存在**硬编码白名单**，可据此判断"设计上就只有这几个端点"，避免继续在白名单外空转。

【坑四：稳定性基线（与同机 13030 的 35% 挂起形成对照）】
本目标 `/api/auth/me` 连打 15 次 = **15/15 全部 401、零超时**（超时率 0%）→ 读数**无需内置对照组即可采信**。
而**同一 IP 的另一个端口（13030）实测 35% 请求挂起** → 同一台机器上的不同应用，稳定性可以完全不同。
**规则：每次路由/端口探测前先跑 15 次稳定性基线，超时率 >10% 才上对照组；≤10% 可直接采信。**

【收口纪律】
当以下四条同时成立时，应当**收口**而不是继续投入：
① 白名单硬编码三条（形态特征佐证）② 三态对照显示带会话全 404 ③ 多实例完全同构 ④ 历史记录已注明业务端点未实现。
本例唯一的残留不确定项是"**只有 POST/PUT/DELETE 的端点排不掉**"（未认证被中间件 401 掩盖、带会话发写请求会触发副作用）——**这类残留应如实声明并评估收益，不要为了"排干净"而向生产后端发写请求**。