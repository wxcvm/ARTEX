# Opt-in control-socket Broker and isolated tool Executor.
# Native Windows and the default docker-compose.yml remain unchanged.
services:
  postgres:
    networks: [runner-control]

  artex:
    environment:
      ARTEX_RUNNER_SOCKET: /run/artex-runner/runner.sock
      ARTEX_RUNNER_PROXY_ADDR: http://artex-proxy-relay:8788
    volumes:
      - runner_socket:/run/artex-runner
    depends_on:
      tool-runner:
        condition: service_healthy
      artex-proxy-relay:
        condition: service_healthy
    networks: [runner-control]

  # Only Broker and ARTEX see the controller-facing socket volume.
  # Broker cannot run any of the SDK execution tools itself.
  tool-runner:
    image: ${ARTEX_IMAGE:-artex}:${ARTEX_TAG:-local}
    entrypoint: ["/app/artex"]
    command: ["-runner-broker-socket", "/run/artex-runner/runner.sock", "-runner-broker-target", "http://tool-executor:8789"]
    environment:
      ARTEX_RUNNER_REMOTE_PEER_ONLY: "1"
    volumes:
      - runner_socket:/run/artex-runner
    depends_on:
      tool-executor:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [runner-control, runner-execution]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/artex-runner/runner.sock"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  # Existing toolkit runs here with access to task/session files only.
  # No controller Socket, JWT private key, database DSN or Docker socket.
  tool-executor:
    image: ${ARTEX_IMAGE:-artex}:${ARTEX_TAG:-local}
    entrypoint: ["/app/artex"]
    command: ["-runner-executor-listen", ":8789"]
    environment:
      HOME: /tmp
    volumes:
      - ./data/tasks:/app/data/tasks
      - ./data/sessions:/app/data/sessions
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=1g"]
    cap_drop: [ALL]
    # Needed by existing raw-network probes; isolated from the controller.
    cap_add: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    networks: [runner-execution]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8789/health >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  # Fixed-port recording-proxy forwarder: no control credentials or volumes.
  artex-proxy-relay:
    image: ${ARTEX_IMAGE:-artex}:${ARTEX_TAG:-local}
    entrypoint: ["/app/artex"]
    command: ["-runner-relay-listen", ":8788", "-runner-relay-target", "artex:8788"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [runner-control, runner-execution]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8788"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

networks:
  runner-control:
  runner-execution:

volumes:
  runner_socket:
