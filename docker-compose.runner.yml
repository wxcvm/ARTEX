# Opt-in Linux Docker Socket Broker + tool Executor.
# Default Compose and native Windows remain untouched.
services:
  postgres:
    networks: [runner-control]

  artex:
    environment:
      ARTEX_RUNNER_SOCKET: /run/artex-runner/runner.sock
      ARTEX_RUNNER_PROXY_ADDR: http://artex-proxy-relay:8788
    volumes:
      - runner_socket:/run/artex-runner
    depends_on:
      tool-runner:
        condition: service_healthy
      artex-proxy-relay:
        condition: service_healthy
    networks: [runner-control]

  # Broker owns the controller-facing socket but no tools or workspaces.
  tool-runner:
    image: ${ARTEX_IMAGE:-artex}:${ARTEX_TAG:-local}
    entrypoint: ["/app/artex"]
    command: ["-runner-broker-socket", "/run/artex-runner/runner.sock", "-runner-broker-target", "/run/artex-executor/executor.sock"]
    environment:
      ARTEX_RUNNER_REMOTE_PEER_ONLY: "1"
    volumes:
      - runner_socket:/run/artex-runner
      - runner_executor_socket:/run/artex-executor
    depends_on:
      tool-executor:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [runner-control]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/artex-runner/runner.sock"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  # Executor can run Bash/files/background/PTY, but has no controller Socket,
  # no DB/JWT credentials and no TCP tool-management listener.
  tool-executor:
    image: ${ARTEX_IMAGE:-artex}:${ARTEX_TAG:-local}
    entrypoint: ["/app/artex"]
    command: ["-runner-socket", "/run/artex-executor/executor.sock"]
    environment:
      HOME: /tmp
    volumes:
      - runner_executor_socket:/run/artex-executor
      - ./data/tasks:/app/data/tasks
      - ./data/sessions:/app/data/sessions
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=1g"]
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    networks: [runner-execution]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/artex-executor/executor.sock"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  artex-proxy-relay:
    image: ${ARTEX_IMAGE:-artex}:${ARTEX_TAG:-local}
    entrypoint: ["/app/artex"]
    command: ["-runner-relay-listen", ":8788", "-runner-relay-target", "artex:8788"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [runner-control, runner-execution]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8788"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

networks:
  runner-control:
  runner-execution:

volumes:
  runner_socket:
  runner_executor_socket:
