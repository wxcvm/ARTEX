name: Fujiang metadata rebuild (temporary)
on:
  push:
    branches:
      - review/dafeiyu-fujiang-metadata-20261117
permissions:
  contents: write
jobs:
  rebuild:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(kb): regenerate Fujiang') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python knowledge/tools/import_fujiang.py
      - run: python knowledge/tools/export_docs.py
      - run: python knowledge/tools/kb_check.py --write
      - run: python tools/scan_sensitive.py
      - name: Commit regenerated index and DB only to review branch
        shell: bash
        run: |
          git add -f knowledge/knowledge.db
          git add knowledge/INDEX.md knowledge/MAP.md knowledge/QA.md
          git add knowledge/pocs/fujiang-*/entry.md
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(kb): regenerate Fujiang metadata from source index'
          git push origin HEAD:refs/heads/review/dafeiyu-fujiang-metadata-20261117
