name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the Release

jobs:
  # ① Frontend static export (once), reused by the cross-compiled platform builds
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② Cross-compile for five platforms (with embedded frontend) + zip packaging
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX self-extracting ELF binaries crash on some Linux kernels, virtualization
          # setups, and security policies. Releases use Go linker trimming and zip
          # compression, prioritizing portability.
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Upload raw Linux binaries separately for reuse by the docker job (avoids rebuilding the frontend + Go inside the image)
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ Native Windows desktop shell + bundled Go backend and web UI.
  desktop:
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Package native Windows desktop
        shell: pwsh
        run: ./desktop/windows/package.ps1 -SkipWebBuild -Version "${{ github.ref_name }}"
      - name: Smoke test release desktop
        shell: pwsh
        timeout-minutes: 3
        run: ./desktop/windows/test-desktop-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-desktop-amd64
          path: dist/ARTEX-Windows-Desktop-amd64.zip
      - name: Build Windows desktop installer
        shell: pwsh
        run: ./desktop/windows/build-installer.ps1 -Version "${{ github.ref_name }}"
      - name: Smoke test release installer and upgrade
        shell: pwsh
        timeout-minutes: 8
        run: ./desktop/windows/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-setup-amd64
          path: dist/ARTEX-Windows-Setup-amd64.exe

  # ④ Collect all zips → create the GitHub Release
  release:
    needs: [binaries, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            test -s "artex-${version}-${platform}.zip"
          done
          test -s ARTEX-Windows-Desktop-amd64.zip
          test -s ARTEX-Windows-Setup-amd64.exe
          sha256sum *.zip *.exe > SHA256SUMS
      - name: Extract versioned release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            /^## / {
              if (found) exit
              if (index($0, "## [" version "]") == 1) { found=1; next }
            }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
          printf '\nSource: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true

  # ⑤ Multi-arch image → push to Docker Hub (reuses the Linux binaries built by the
  #    binaries job; the image only installs tools + ships the binary; arm64 only needs
  #    to emulate the apt layer, so builds are much faster)
  # Publishing the image needs Docker Hub credentials and a namespace we own, so the
  # job stays skipped unless the repository defines DOCKERHUB_ENABLED (set it to true
  # and provide DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets plus DOCKERHUB_IMAGE).
  docker:
    needs: binaries
    if: ${{ vars.DOCKERHUB_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # fetch the Dockerfile and skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
