name: ci

on:
  push:
    branches: [main]
  pull_request:

# Superseded commits on the same PR should not occupy scarce Windows runners.
# Every main commit still has its own independent CI run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: artextest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Check release build script entrypoint
        run: |
          bash -n build.sh
          test -x build.sh
          ./build.sh --help
      - name: Check local Docker source build script syntax
        run: bash -n scripts/docker-build-fork.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Docker runner isolation smoke (fake credentials only)
        run: bash scripts/ci/runner-isolation-smoke.sh
      - name: Docker runner proxy relay and network separation smoke
        run: bash scripts/ci/runner-relay-smoke.sh
      - name: Docker broker and tool executor isolation smoke
        run: bash scripts/ci/runner-broker-smoke.sh
      - name: Mode B verifier shell syntax
        run: bash -n scripts/mode-b-verify.sh scripts/ci/mode-b-network-smoke.sh
      - name: Mode B Compose parse (fake credentials, no external traffic)
        env:
          POSTGRES_PASSWORD: ci-fixture-only
        run: |
          docker compose -f docker-compose.yml -f docker-compose.mode-b.yml config --quiet
          go test ./modeb -count=1
      - name: Docker Compose broker/executor startup smoke
        run: bash scripts/ci/runner-compose-smoke.sh
      - name: Mode B Docker direct and upstream-outage fail-closed smoke
        run: bash scripts/ci/mode-b-network-smoke.sh
      - name: Full Compose ARTEX/PostgreSQL/local proxy smoke
        run: bash scripts/ci/runner-full-stack-smoke.sh
      # Skipped tests, tracked in issue #9:
      # - TestGraphOverviewExpandsAssociatedCompanyScope,
      #   TestCaptureApprovalLifecycle: fail on unmodified upstream code with a
      #   fresh database.
      # - TestSideUsageRecordedOnceOnConsumerCancellation: concurrency/cancellation
      #   test that passes locally but is timing-sensitive on 2-core CI runners.
      # They now skip themselves in code (t.Skip with a pointer to the issue).
      - name: go test
        # -p 1: package test suites share the single postgres service; running
        # them in parallel makes packages delete each other's rows (observed
        # as rotating failures in the agent package). Serial package execution
        # keeps the database state deterministic.
        run: go test -p 1 ./...
      - name: LLM health concurrency regression
        run: go test -race -count=10 ./llmpool
      - name: PostgreSQL pause and revival integration
        run: go test -race -count=20 ./server -run 'TestPauseShiftsTaskDeadlineOnResume|TestPauseCommitFailureCompensatesWithPostgres|TestTimedOutTaskRevivalResetsClockAndSettlingAcrossFIFO'

  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/benchmark -p test_engineering.py
      - name: Backup file protection and retention regression
        run: python -m unittest discover -s scripts -p test_backup.py
      - name: Read-only knowledge retrieval regression
        run: go test -race -count=20 ./kb
      - run: python scripts/benchmark/run_engineering.py --repeat 20 --race
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-engineering
          path: benchmark-results/engineering/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build:static
      - uses: actions/upload-artifact@v4
        with:
          name: ci-web-dist
          path: web/out

  windows:
    # One Windows runner for the native tests and desktop artifacts.
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: Knowledge paths and literal search on Windows
        run: go test ./kb -count=20
      - name: Native Windows storage permission diagnostics
        run: go test ./server -run '^(TestInspectStorage|TestStoragePermissions)' -count=1
      - run: go test ./server -run 'TestTaskTransition|TestWebAPIEngineering|TestDownload' -count=20
      - run: go test ./server -run '^(TestExternalTool|TestJWTKey)' -count=1
      - run: go test ./mcphttp -run '^TestStreamableClient(ProtocolVersions|VersionRejectionForms)$' -count=1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: ci-web-dist
          path: server/webui/dist
      - name: Check incremental desktop frontend cache invalidation
        shell: pwsh
        run: ./desktop/windows/test-frontend-cache.ps1
      - name: Build portable Windows desktop bundle
        shell: pwsh
        run: ./desktop/windows/package.ps1 -SkipWebBuild -Version preview
      - name: Check database setup DPI layout and password input regression
        shell: pwsh
        run: ./desktop/windows/test-database-setup-layout.ps1
      - name: Smoke test database setup layout with large font and narrow window
        shell: pwsh
        timeout-minutes: 3
        run: dotnet run --project ./tests/windows-db-layout/WindowsDbLayoutSmoke.csproj --configuration Release
      - name: Smoke test native desktop window and WebView2 navigation
        shell: pwsh
        timeout-minutes: 3
        run: ./desktop/windows/test-desktop-smoke.ps1
      - name: Download and verify PostgreSQL 16 binaries
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'postgresql-16.16-2-windows-x64-binaries.zip'
          $curl = (Get-Command curl.exe -ErrorAction Stop).Source
          & $curl --fail --location --show-error --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 420 --progress-bar --output $archive --write-out "downloaded=%{size_download} bytes elapsed=%{time_total}s http=%{http_code}`n" 'https://get.enterprisedb.com/postgresql/postgresql-16.16-2-windows-x64-binaries.zip'
          if ($LASTEXITCODE -ne 0) { throw "PostgreSQL binaries download failed (curl exit $LASTEXITCODE)" }
          if (-not (Test-Path -LiteralPath $archive)) { throw "PostgreSQL binaries archive was not downloaded" }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          $expected = 'ADD1DE261B150E6923266ABEE293F05050795E73F5356158AEE4221A2170C073'
          if ($actual -ne $expected) { throw "PostgreSQL binaries checksum mismatch: $actual" }
          Write-Host "[ARTEX] PostgreSQL binaries downloaded and checksum verified."

      - name: Extract PostgreSQL 16 runtime for independent-cluster integration
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'postgresql-16.16-2-windows-x64-binaries.zip'
          $prefix = Join-Path $env:ProgramFiles 'PostgreSQL\16'
          New-Item -ItemType Directory -Path $prefix -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $prefix -Force
          $payload = Join-Path $prefix 'pgsql'
          $payloadBin = Join-Path $payload 'bin'
          foreach ($name in @('initdb.exe', 'pg_ctl.exe', 'postgres.exe')) {
            if (-not (Test-Path (Join-Path $payloadBin $name))) { throw "PostgreSQL archive missing: $name" }
          }
          Get-ChildItem -LiteralPath $payload | ForEach-Object {
            Move-Item -LiteralPath $_.FullName -Destination $prefix -Force
          }
          Remove-Item -LiteralPath $payload -Recurse -Force
          $bin = Join-Path $prefix 'bin'
          foreach ($name in @('initdb.exe', 'pg_ctl.exe', 'postgres.exe')) {
            if (-not (Test-Path (Join-Path $bin $name))) { throw "PostgreSQL runtime missing after extraction: $name" }
          }
          $version = & (Join-Path $bin 'postgres.exe') --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^postgres \(PostgreSQL\) 16\.') {
            throw "Unexpected PostgreSQL runtime: $version"
          }
          Write-Host "[ARTEX] PostgreSQL runtime extracted: $version"
      - name: Ordinary-user database preparation and onboarding boundaries
        shell: pwsh
        timeout-minutes: 8
        run: ./desktop/windows/test-onboarding.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: artex-windows-desktop-preview
          path: dist/ARTEX-Windows-Desktop-amd64.zip
      - name: Build Windows installer
        shell: pwsh
        run: |
          ./desktop/windows/build-installer.ps1 -Version 0.0.0-preview
      - name: Smoke test installer and upgrade
        shell: pwsh
        timeout-minutes: 8
        run: ./desktop/windows/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: artex-windows-setup-preview
          path: dist/ARTEX-Windows-Setup-amd64.exe

  # Keep the existing desktop check name for branch protection. Its result
  # reflects the full Windows job, including the desktop and installer tests.
  desktop:
    needs: windows
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require Windows desktop validation
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: test "$WINDOWS_RESULT" = success
